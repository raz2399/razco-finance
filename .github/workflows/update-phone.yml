# Push once, and both apps change.
#
# The website already works this way: Netlify watches main and redeploys
# itself. The phone did not, because a built app cannot change its own
# JavaScript -- which is why every one-line fix cost a build, an upload to
# Apple, and a trip through TestFlight.
#
# expo-updates closes that gap. This runs on a push that touched the phone
# app and sends the new JavaScript to the installed app, which picks it up
# the next time it is opened.
#
# What it cannot do: anything that changes native code. A new native library,
# a permission string, an icon, an SDK upgrade -- those still need a build.
# JavaScript, which is nearly everything, does not.
#
# Requires one secret, EXPO_TOKEN, from https://expo.dev/settings/access-tokens

name: Send the phone app its update

on:
  push:
    branches: [main]
    # Only when the phone app actually changed. A backend fix has no business
    # pushing a pointless update to a phone in a cold stockroom.
    paths:
      - 'mobile/**'
      - '.github/workflows/update-phone.yml'
  # And on demand, for when something needs pushing without a commit.
  workflow_dispatch:

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check for EXPO_TOKEN
        # The secret arrives through the environment, never pasted into the
        # script text. Written inline, a token holding a $ or a quote either
        # gets expanded away -- reading as empty when it is not -- or breaks
        # the line it sits in. Both fail here, claiming the secret is
        # missing while it sits in the repository exactly as it should.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret is set on this repository, so there is"
            echo "nothing to authenticate with. Create one at"
            echo "https://expo.dev/settings/access-tokens and add it under"
            echo "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The production channel is the one the TestFlight build listens on;
      # it is named in eas.json against the production build profile.
      - name: Publish the update
        # Same rule for the commit message, and here it matters more: a
        # message is text anyone with push access writes. Pasted into the
        # command it would be read as part of the command.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="${COMMIT_MESSAGE:-Manual update}"
          # One line of it. Commit messages here run to twenty.
          MESSAGE="$(printf '%s' "$MESSAGE" | head -n 1)"
          eas update --channel production --message "$MESSAGE" --non-interactive
