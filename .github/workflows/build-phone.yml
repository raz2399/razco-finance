# A new binary, when JavaScript alone cannot do it.
#
# Nearly every change ships as an update: update-phone.yml sends the new
# JavaScript and the installed app applies it on its own. That covers
# screens, calculations, endpoints -- almost everything.
#
# What it cannot cover is native code. A new native library, a permission
# string, an icon, an SDK bump: none of those live in the JavaScript
# bundle, so the app has to be built and go through TestFlight again.
#
# This runs when one of those things changes, and on demand. It does not
# run on an ordinary push, because a build Raz has to install is a cost and
# is not paid unless something needs it.
#
# Requires the same EXPO_TOKEN secret the update workflow uses.

name: Build the phone app

on:
  push:
    branches: [main]
    paths:
      # The three files that decide what goes into a binary.
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/eas.json'
      # Deliberately NOT this file. Editing the recipe is not a reason to
      # bake another cake, and a build is one Raz has to install.
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which EAS build profile'
        required: false
        default: 'production'
        type: choice
        options: [production, preview]

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        # Through the environment, never pasted into the script text: a
        # token holding a $ or a quote would either be expanded away --
        # reading as empty when it is not -- or break the line it sits in.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret is set on this repository."
            echo "Create one at https://expo.dev/settings/access-tokens and"
            echo "add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for iOS and send it to TestFlight
        # --auto-submit is the point of the whole file. Without it the
        # build finishes and sits on EAS as a file, and somebody has to go
        # and push it to Apple by hand -- which is the manual step this
        # exists to remove, just moved one stage later.
        #
        # --non-interactive because nobody is sitting here to answer it,
        # and --no-wait so the job is not billed for twenty minutes of
        # watching a queue. The build carries on at EAS either way.
        #
        # The fallback matters. --auto-submit needs App Store Connect
        # credentials on EAS, and in non-interactive mode it will not stop
        # and ask for them -- it refuses the whole command, so NO build is
        # queued at all. That is the worse failure of the two: a binary
        # that finishes and waits to be sent on still beats no binary.
        # So: try to go all the way, and if submission cannot be set up,
        # build anyway and say so.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          set +e
          npx eas-cli@latest build \
            --platform ios --profile "$PROFILE" \
            --auto-submit --non-interactive --no-wait
          if [ $? -eq 0 ]; then
            echo "SUBMITTED=yes" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::Could not queue with --auto-submit. Building"
          echo "::warning::without it; the binary will need sending to Apple."
          npx eas-cli@latest build \
            --platform ios --profile "$PROFILE" \
            --non-interactive --no-wait || exit 1
          echo "SUBMITTED=no" >> "$GITHUB_ENV"

      - name: Where to watch it
        run: |
          echo "Build queued. It appears under Builds on expo.dev."
          if [ "$SUBMITTED" = "yes" ]; then
            echo "It goes on to TestFlight by itself; Apple takes a few"
            echo "more minutes to process it before it can be installed."
          else
            echo
            echo "It will NOT go to TestFlight on its own: EAS has no App"
            echo "Store Connect credentials to submit with. Setting those"
            echo "up once -- 'eas credentials', or an App Store Connect API"
            echo "key on the EAS project -- makes every build after this"
            echo "one go all the way through."
          fi
